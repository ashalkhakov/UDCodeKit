name: Build

# UDCodeKit and UDCode, built, tested and installed the familiar way (make,
# make check, make install; Makefile.apple on macOS) by gnustep-release-
# actions' workflows, the same as every repository's. Every push is built,
# tested and uploaded as artifacts: UDCodeKit as a library (the installed
# frameworks and grammar bundles for Linux, x86_64 and aarch64, and for
# Windows; the XCFrameworks for Apple) for what builds on it, and UDCode as
# an AppImage (started on a clean Ubuntu), a Windows installer (installed and
# started on a clean Windows) and a Mac app. A v* tag (or a run started by
# hand with one) is also released: the AppImage with its update information,
# the Windows installer, the Mac app signed and notarized with its Sparkle appcast, attached to the
# tag's release (a pre-release when the tag has a '-'). What it builds on is
# in .github/pins.env.
on:
  push:
    branches-ignore: ['copilot/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and release (empty: this branch, as artifacts)'
        required: false
        default: ''

# Pushes only: a push to a branch already shows its checks on the branch's
# pull request. A newer push supersedes the run before it; a release is
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  linux:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/linux.yml@v1
    with:
      tag: ${{ inputs.tag }}
      library: true
      # lldb (lldb-vscode), which speaks DAP: the tests debug programs with
      # it, gdb (the runner's) where it does not; SQLite's, libpq's and
      # MariaDB Connector/C's headers, for the SQL extension (the last two loaded
      # when there, not linked)
      extra-packages: lldb libsqlite3-dev libpq-dev libmariadb-dev
      # the SQL extension's tests run against these too (POSTGRES_URL, MYSQL_URL, MARIADB_URL)
      databases: postgres mysql mariadb

  windows:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/windows.yml@v1
    with:
      tag: ${{ inputs.tag }}
      library: true
      # lldb-dap and gdb, which speak DAP: the tests run and debug programs with them, as on Linux;
      # SQLite, libpq (postgresql) and MariaDB Connector/C, for the SQL extension
      extra-packages: lldb gdb sqlite3 postgresql libmariadbclient
    # the Sparkle key: the installed app's updates, and the Windows appcast signed
    secrets: inherit

  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos.yml@v1
    with:
      tag: ${{ inputs.tag }}
      library: true
      apps: UDCode=UDCode
    secrets: inherit
