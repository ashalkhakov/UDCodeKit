# UDCode's AppImage: what it carries and starts. The image is
# gnustep-release-actions' appimage (the launcher, the runtime, the fonts),
# the same as every app's; see its appimage.sh for each name.
IMAGE=UDCode
NAME=UDCode
APPS="UDCode"
DEFAULT=UDCode
WITH_FILE=UDCode
ENTRIES="scripts/appimage/udcode.desktop=scripts/appimage/udcode.png"
# The grammar bundles, CFamily, Git and SQL are loaded, not linked (Markdown's brings libstdc++).
LOADED="UDCode.app/PlugIns/*.bundle/*"
REQUIRE="UDCode.app/Resources/MainMenu.xib UDCode.app/PlugIns/TreeSitterJson.bundle/TreeSitterJson UDCode.app/PlugIns/TreeSitterMarkdown.bundle/TreeSitterMarkdown UDCode.app/PlugIns/CFamily.bundle/CFamily UDCode.app/PlugIns/Git.bundle/Git UDCode.app/PlugIns/SQL.bundle/SQL UDCode.app/PlugIns/TreeSitterSql.bundle/TreeSitterSql"
# On a clean Ubuntu: UDCode starts, with its interface and its grammars.
SMOKE_SCRIPT=scripts/appimage-smoke.sh
