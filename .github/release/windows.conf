# UDCode's Windows installer: what it carries and starts. The installer is
# gnustep-release-actions' msi (the runtime, WinUXTheme), the same as every
# app's; see its msi.sh for each name.
NAME=UDCode
APPS="UDCode"
DEFAULT=UDCode
ICON=scripts/appimage/udcode.png
SUMMARY="A code editor: tree-sitter highlighting, language servers, workspaces"
# The SQL extension's client libraries (libpq, libmariadb), which it loads
# beside gnustep-base's DLL in the runtime: the packager brings the DLLs
# they link, as for the runtime's own (scripts/sql-clients.sh).
PREPARE="scripts/windows-sql-clients.sh"
# No self-test: started bare it is still up 25 seconds later, its interface
# loaded, as the AppImage's smoke test has it.
SMOKE_STAYS_UP=25
